{% extends 'base.html' %}
{% block title %}Editar produto | Gestão{% endblock %}
{% block content %}
<main class="management-shell">
  <div class="page-heading">
    <div><span class="eyebrow">Cardápio da loja</span><h1>Editar produto</h1><p class="muted">{{ product.name }}</p></div>
    <a class="button" href="{% url 'gestao_produtos' %}">Voltar para produtos</a>
  </div>
  <section class="panel product-edit-panel">
    <form method="post" class="stack-form">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="page-actions">
        <a class="button" href="{% url 'gestao_produtos' %}">Cancelar</a>
        <button class="button primary" type="submit">Salvar alterações</button>
      </div>
    </form>
  </section>
</main>
{% endblock %}
